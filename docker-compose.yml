services:
  app:
    build:
      context: .
    image: spisoc-del-api:latest
    container_name: spisoc_app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-spisok_del_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    # command: [ "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      # По умолчанию как раньше — на всех интерфейсах. С HTTPS-прокси (профиль https, docs/INSTALL.md) задайте в
      # .env.prod APP_BIND=127.0.0.1: приложение тогда доступно снаружи только через Caddy, а не напрямую по http.
      - "${APP_BIND:-0.0.0.0}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    image: spisoc-del-api:latest
    container_name: spisoc_bot
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-spisok_del_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: python -m src.bot.runner
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: spisoc_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spisok_del_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Только loopback: с хоста (и по ssh-туннелю) доступен, с внешних интерфейсов — нет.
      # Запись `ports: []` в override-файле НЕ убирает порты базового файла (списки
      # ports при слиянии складываются), поэтому «закрыть» порт можно только здесь.
      # Порт на хосте настраивается: если 5432 занят локальным PostgreSQL, задайте в .env
      # POSTGRES_HOST_PORT=55432 (внутри Docker-сети приложение по-прежнему ходит на postgres:5432).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-spisok_del_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: spisoc_redis
    ports:
      - "127.0.0.1:63790:6379"  # только loopback, см. комментарий у postgres
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Бэкап БД по умолчанию: раз в сутки pg_dump в ./backups (BACKUP_HOUR, по UTC), старые дампы удаляются
  # (BACKUP_LOCAL_RETENTION_DAYS). Первый дамп снимается сразу при запуске. Ручной дамп:
  #   docker compose run --rm backup once
  # Без отдельного профиля: бэкап — часть базовой установки, отключать его не нужно. Выгрузка в R2 и
  # восстановление — scripts/backup.sh и README. Образ postgres:16 — та же версия, что у сервера (pg_dump должен совпадать).
  backup:
    image: postgres:16-alpine
    container_name: spisoc_backup
    # tr убирает \r: на Windows git может превратить переводы строк скрипта в CRLF, и тогда /bin/sh падает на `set -eu\r`.
    entrypoint: [ "/bin/sh", "-c", "tr -d '\\r' < /usr/local/bin/backup_loop.sh > /tmp/backup_loop.sh && exec /bin/sh /tmp/backup_loop.sh \"$$@\"", "backup" ]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-spisok_del_db}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_LOCAL_RETENTION_DAYS: ${BACKUP_LOCAL_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/backup_loop.sh:/usr/local/bin/backup_loop.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Нездоров, если за последние ~26 часов не появилось ни одного дампа: виден в `docker compose ps`.
      test: [ "CMD-SHELL", "find /backups -maxdepth 1 -name 'db-*.sql.gz' -mmin -1560 | grep -q ." ]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 15m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: [ "monitoring" ]
    ports:
      - "127.0.0.1:9090:9090"  # только loopback, см. комментарий у postgres
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: [ "monitoring" ]
    ports:
      - "127.0.0.1:3000:3000"  # только loopback, см. комментарий у postgres
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  grafana_data:
