[project]
name = "spisoc_del_api"
version = "0.1.0"
description = "Task list API with Telegram bot and admin panel"
readme = "README.md"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F403"]
