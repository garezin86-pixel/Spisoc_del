services:
  app:
    env_file:
      - path: .env.prod
        required: true  # прод не должен молча стартовать на дев-дефолтах из docker-compose.yml
    environment:
      ENV: production
    restart: always

  bot:
    env_file:
      - path: .env.prod
        required: true  # прод не должен молча стартовать на дев-дефолтах из docker-compose.yml
    environment:
      ENV: production
    restart: always

  postgres:
    ports: []
    restart: always

  redis:
    ports: []
    restart: always

  prometheus:
    restart: always

  grafana:
    restart: always
