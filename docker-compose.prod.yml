services:
  app:
    env_file:
      - path: .env.prod
        required: true  # прод не должен молча стартовать на дев-дефолтах из docker-compose.yml
    environment:
      ENV: production
      # ВАЖНО: `environment:` всегда перебивает `env_file:` для одного и того
      # же имени переменной. Значит DATABASE_URL из .env.prod (через env_file
      # выше) в любом случае был бы проигнорирован — реально использовался бы
      # DATABASE_URL из базового docker-compose.yml с фолбэком
      # ${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}, то есть
      # postgres:postgres, даже если в .env.prod указаны другие креды.
      # Поэтому здесь пересобираем DATABASE_URL из тех же обязательных
      # POSTGRES_*-переменных, что и сам контейнер postgres ниже — это
      # гарантирует, что app/bot и postgres всегда используют одни и те же
      # креды, и что деплой упадёт с понятной ошибкой, если их забыли задать
      # (см. также docker compose --env-file .env.prod в README).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER обязателен в проде}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен в проде}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB обязателен в проде}
    restart: always

  bot:
    env_file:
      - path: .env.prod
        required: true  # прод не должен молча стартовать на дев-дефолтах из docker-compose.yml
    environment:
      ENV: production
      # См. комментарий у app выше — та же причина.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER обязателен в проде}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен в проде}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB обязателен в проде}
    restart: always

  postgres:
    ports: []
    restart: always
    environment:
      # Те же обязательные переменные, что использованы выше для DATABASE_URL —
      # так они физически не могут разъехаться с app/bot.
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB обязателен в проде}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER обязателен в проде}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен в проде}

  redis:
    ports: []
    restart: always

  prometheus:
    # Не публикуем наружу — доступ только из Docker-сети (например, через
    # grafana или ssh-туннель/nginx с basic-auth, если нужен внешний доступ).
    ports: []
    restart: always

  grafana:
    # Аналогично prometheus: наружу не торчит. Если нужен внешний доступ —
    # заводить через reverse proxy с TLS и отдельной авторизацией, а не
    # публиковать порт напрямую.
    ports: []
    restart: always
    environment:
      # ВАЖНО: docker-compose.yml имеет фолбэк ${GRAFANA_ADMIN_PASSWORD:-admin}.
      # Секции env_file внутри сервисов НЕ участвуют в подстановке ${...} самого
      # compose-файла — её видит только shell-окружение или файл `.env`
      # (или --env-file). Поэтому переопределяем здесь явно с `:?...`, чтобы
      # прод не смог молча стартовать с паролем admin/admin: если переменная
      # не резолвится (не задана в shell/.env/--env-file) — деплой упадёт
      # с понятной ошибкой вместо тихого дефолта.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD обязателен в проде. Задай его в shell-окружении, файле .env рядом с docker-compose.yml, или передай через --env-file .env.prod}
